<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shortly</title>
  <style>
    body { font-family: system-ui; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    input, button { padding: 10px; font-size: 16px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .card { background: #f3f4f6; padding: 14px; border-radius: 8px; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Shortly</h1>
  <input id="url" placeholder="https://example.com/very/long/link" />
  <input id="alias" placeholder="Custom alias (optional)" />
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

  <h2>Link stats</h2>
  <input id="code" placeholder="Enter short code" />
  <button onclick="getStats()">Get stats</button>
  <div id="stats"></div>

<script>
// Escape user-supplied text before putting it in HTML (prevents stored XSS).
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, options) {
  try {
    const res = await fetch(path, options);
    return await res.json();
  } catch {
    return { error: "Network error, please try again" };
  }
}

async function shorten() {
  const data = await api("/api/shorten", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: url.value.trim(), alias: alias.value.trim() || undefined })
  });
  result.innerHTML = `<div class="card">${data.error ? "Error: " + esc(data.error)
    : `Done: <a href="${esc(data.short)}" target="_blank" rel="noopener">${esc(data.short)}</a>`}</div>`;
}

async function getStats() {
  const d = await api("/api/stats/" + encodeURIComponent(code.value.trim()));
  const box = document.getElementById("stats");
  if (d.error) { box.innerHTML = `<div class="card">Error: ${esc(d.error)}</div>`; return; }
  box.innerHTML = `<div class="card">
    <b>${esc(d.original)}</b><br>Total clicks: ${d.totalClicks}<br><br>
    <b>Last 7 days:</b> ${esc(d.daily.map(x => `${x.day}: ${x.clicks}`).join(", ") || "none")}<br>
    <b>Top referrers:</b> ${esc(d.referrers.map(x => `${x.referrer} (${x.clicks})`).join(", ") || "none")}
  </div>`;
}
</script>
</body>
</html>
